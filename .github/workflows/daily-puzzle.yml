name: Generar sudoku diario

on:
  schedule:
    # 09:00 UTC cae a las 05:00-06:00 en Chile continental según horario de
    # verano/invierno; suficientemente temprano para que el tablero del día
    # esté listo antes de que amanezca en Chile.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-puzzle
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar tableros del día
        run: python3 tools/generate_daily_puzzles.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ sudokus/ play.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Sudoku automático del día"
          git pull --rebase origin main
          git push origin main
